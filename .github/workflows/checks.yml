name: Repository checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - name: Check notebook JSON and Python syntax
        run: python scripts/check_notebooks.py --root notebooks
      - name: Install Adult Income test dependencies
        run: python -m pip install -r projects/adult_income/requirements.txt
      - name: Check preprocessing and persisted predictions
        working-directory: projects/adult_income
        run: python -m unittest discover -s tests -v
